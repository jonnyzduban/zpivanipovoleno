<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🔥 Zpívání povoleno 2.0</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --card-hover: #2a2a2a;
            --text-color: #e0e0e0;
            --accent-color: #ff9800;
            --chord-color: #ffb74d;
            --border-color: #333;
        }

        body.light-theme {
            --bg-color: #ffffff;
            --card-bg: #ffffff;
            --card-hover: #f5f5f5;
            --text-color: #000000;
            --accent-color: #ff9800;
            --chord-color: #cc0000;
            --border-color: #eee;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 4px 6px;
            max-width: 800px;
            margin: 0 auto;
            min-height: 100vh;
            transition: background-color 0.2s, color 0.2s;
        }

        /* Hlavička a Navigace */
        header {
            position: sticky;
            top: 0;
            background-color: var(--bg-color);
            padding: 4px 0;
            border-bottom: 2px solid var(--accent-color);
            margin-bottom: 6px;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: space-between;
            -webkit-user-select: none;
            user-select: none;
            touch-action: manipulation;
        }

        .header-title {
            font-size: 18px;
            font-weight: bold;
            color: var(--accent-color);
            cursor: pointer;
            display: flex;
            align-items: center;
            -webkit-user-select: none;
            user-select: none;
        }

        .header-controls {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .btn-ctrl {
            background-color: var(--card-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            touch-action: manipulation;
        }

        .btn-theme {
            background-color: var(--accent-color);
            color: #fff;
            border: none;
            padding: 4px 8px;
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
            touch-action: manipulation;
        }

        /* Vyhledávání a Seznam */
        .search-box {
            width: 100%;
            padding: 6px 10px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background-color: var(--card-bg);
            color: var(--text-color);
            font-size: 14px;
            margin-bottom: 6px;
            outline: none;
        }

        .song-list {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .song-item {
            background-color: var(--card-bg);
            padding: 5px 10px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            -webkit-user-select: none;
            user-select: none;
            touch-action: manipulation;
            line-height: 1.2;
        }

        .song-item:active {
            background-color: var(--card-hover);
        }

        .song-item::after {
            content: "❯";
            color: #888;
            font-size: 11px;
            margin-left: 6px;
        }

        .song-number {
            color: var(--accent-color);
            font-weight: normal;
            font-size: 0.85em;
            margin-right: 6px;
            opacity: 0.7;
        }

        .artist-name {
            font-size: 0.85em;
            color: #888;
            font-weight: normal;
        }

        /* Detail Písně */
        .song-detail {
            display: none;
            background-color: var(--card-bg);
            padding: 10px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            overflow-x: auto;
        }

        .song-header-detail {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            padding-bottom: 6px;
            border-bottom: 1px solid var(--border-color);
            -webkit-user-select: none;
            user-select: none;
        }

        .song-title {
            font-size: 18px;
            font-weight: 700;
            color: var(--accent-color);
            margin: 0;
        }

        body.light-theme .song-title {
            color: #000000;
        }

        .font-controls {
            display: flex;
            gap: 6px;
        }

        pre {
            font-family: 'Roboto Mono', Consolas, monospace;
            font-size: 14px;
            font-weight: 400;
            line-height: 1.35;
            letter-spacing: 0;
            word-spacing: 0;
            white-space: pre;
            color: var(--text-color);
            margin: 0;
            -webkit-font-smoothing: antialiased;
        }

        .chord {
            color: var(--chord-color);
            font-weight: 700;
            background-color: transparent;
        }
    </style>
</head>
<body>

    <header>
        <div id="header-title" class="header-title" onclick="goBack()">🔥 Zpívání povoleno 2.0</div>
        <div class="header-controls">
            <button class="btn-theme" id="btn-theme" onclick="toggleTheme(event)" title="Přepnout motiv">☀️</button>
        </div>
    </header>

    <!-- POHLED 1: SEZNAM PÍSNÍ -->
    <div id="view-list">
        <input type="text" class="search-box" id="search" placeholder="🔍 Hledat písničku nebo interpreta..." oninput="filterSongs()">
        <div class="song-list" id="song-list">
            <div style="text-align: center; color: #888; padding: 20px;">Načítám seznam písní...</div>
        </div>
    </div>

    <!-- POHLED 2: DETAIL PÍSNĚ -->
    <div id="view-detail" class="song-detail">
        <div class="song-header-detail">
            <h2 class="song-title" id="detail-title"></h2>
            <div class="font-controls">
                <button class="btn-ctrl" onclick="changeFontSize(-1)">A-</button>
                <button class="btn-ctrl" onclick="changeFontSize(1)">A+</button>
            </div>
        </div>
        <pre id="detail-content"></pre>
    </div>

    <script>
        let allSongs = [];
        let currentFilteredSongs = [];
        let currentFontSize = 14;
        let wakeLock = null; // Proměnná pro uchování stavu Wake Lock

        function initTheme() {
            const savedTheme = localStorage.getItem('theme');
            const themeBtn = document.getElementById('btn-theme');
            
            if (savedTheme === 'light') {
                document.body.classList.add('light-theme');
                themeBtn.innerText = '🌙';
            } else {
                themeBtn.innerText = '☀️';
            }
        }

        function toggleTheme(event) {
            if (event) event.stopPropagation();
            const body = document.body;
            const themeBtn = document.getElementById('btn-theme');
            body.classList.toggle('light-theme');
            
            if (body.classList.contains('light-theme')) {
                localStorage.setItem('theme', 'light');
                themeBtn.innerText = '🌙';
            } else {
                localStorage.setItem('theme', 'dark');
                themeBtn.innerText = '☀️';
            }
        }

        async function fetchSongList() {
            const listContainer = document.getElementById('song-list');
            try {
                const pathParts = window.location.pathname.split('/').filter(p => p);
                const hostnameParts = window.location.hostname.split('.');
                let songs = [];

                if (window.location.hostname.includes('github.io')) {
                    const user = hostnameParts[0];
                    const repo = pathParts[0] || '';
                    const apiUrl = `https://api.github.com/repos/${user}/${repo}/contents/`;

                    const response = await fetch(apiUrl);
                    if (response.ok) {
                        const files = await response.json();
                        songs = files
                            .filter(file => file.name.endsWith('.txt'))
                            .map(file => ({
                                formattedName: formatTitle(file.name),
                                rawName: cleanTitle(file.name),
                                url: file.download_url
                            }));
                    }
                }

                if (songs.length === 0) {
                    const res = await fetch('songs.json').catch(() => null);
                    if (res && res.ok) {
                        const fileNames = await res.json();
                        songs = fileNames.map(name => ({
                            formattedName: formatTitle(name),
                            rawName: cleanTitle(name),
                            url: name
                        }));
                    }
                }

                songs.sort((a, b) => a.rawName.localeCompare(b.rawName, 'cs', { sensitivity: 'base' }));
                allSongs = songs;
                renderSongList(allSongs);

            } catch (err) {
                listContainer.innerHTML = '<div style="text-align:center; padding:20px;">Chyba při načítání souborů.</div>';
            }
        }

        function cleanTitle(filename) {
            let name = filename.replace(/\.txt$/i, '').replace(/_/g, ' ').trim();
            if (name === name.toUpperCase()) name = name.toLowerCase();
            return name.charAt(0).toUpperCase() + name.slice(1);
        }

        function formatTitle(filename) {
            const fullTitle = cleanTitle(filename);
            const parts = fullTitle.split('-');
            if (parts.length > 1) {
                const songName = parts[0].trim();
                const artistName = parts.slice(1).join('-').trim();
                return `${songName} <span class="artist-name">- ${artistName}</span>`;
            }
            return fullTitle;
        }

        function renderSongList(songs) {
            currentFilteredSongs = songs;
            const listContainer = document.getElementById('song-list');
            if (songs.length === 0) {
                listContainer.innerHTML = '<div style="text-align:center; padding:20px;">Žádné písně nenalezeny.</div>';
                return;
            }
            listContainer.innerHTML = songs.map((song, index) => `
                <div class="song-item" onclick="openSongByIndex(${index})">
                    <div><span class="song-number">${index + 1}.</span>${song.formattedName}</div>
                </div>
            `).join('');
        }

        function filterSongs() {
            const query = document.getElementById('search').value.toLowerCase();
            const filtered = allSongs.filter(s => s.rawName.toLowerCase().includes(query));
            renderSongList(filtered);
        }

        function openSongByIndex(index) {
            const song = currentFilteredSongs[index];
            if (!song) return;
            history.pushState({ view: 'detail' }, '', '#detail');
            showDetailUI(song);
        }

        async function showDetailUI(song) {
            document.getElementById('view-list').style.display = 'none';
            document.getElementById('view-detail').style.display = 'block';
            document.getElementById('detail-title').innerHTML = song.formattedName;
            
            // Aktivace zabránění zhasnutí displeje
            await requestWakeLock();

            openSongContent(song.url);
        }

        async function openSongContent(url) {
            const contentElem = document.getElementById('detail-content');
            contentElem.innerText = "Načítám...";

            try {
                const targetUrl = url.startsWith('http') ? url : encodeURIComponent(url);
                const response = await fetch(targetUrl);
                
                if (!response.ok) throw new Error("Soubor nelze stáhnout");
                
                const text = await response.text();
                contentElem.innerHTML = highlightChords(text);
                
                setTimeout(autoFitFont, 50);
            } catch (err) {
                contentElem.innerText = "Chyba při načítání písně.";
            }

            window.scrollTo(0, 0);
        }

        // Funkce pro požadavek na nezhasínání displeje
        async function requestWakeLock() {
            if ('wakeLock' in navigator) {
                try {
                    wakeLock = await navigator.wakeLock.request('screen');
                } catch (err) {
                    // Uživatelský systém mohl požadavek zamítnout (např. nízký stav baterie)
                    console.log(`${err.name}, ${err.message}`);
                }
            }
        }

        // Funkce pro uvolnění zámku (při návratu na seznam)
        async function releaseWakeLock() {
            if (wakeLock !== null) {
                try {
                    await wakeLock.release();
                    wakeLock = null;
                } catch (err) {
                    console.log(`${err.name}, ${err.message}`);
                }
            }
        }

        function autoFitFont() {
            const contentElem = document.getElementById('detail-content');
            let size = 16;
            contentElem.style.fontSize = size + 'px';

            const containerWidth = contentElem.clientWidth;
            
            while (contentElem.scrollWidth > containerWidth && size > 7) {
                size -= 0.5;
                contentElem.style.fontSize = size + 'px';
            }
            currentFontSize = size;
        }

        function changeFontSize(delta) {
            currentFontSize = Math.max(7, Math.min(24, currentFontSize + delta));
            document.getElementById('detail-content').style.fontSize = currentFontSize + 'px';
        }

        function goBack() {
            if (window.location.hash === '#detail') {
                history.back();
            } else {
                showListUI();
            }
        }

        async function showListUI() {
            // Uvolnění Wake Locku při návratu na seznam
            await releaseWakeLock();

            document.getElementById('view-list').style.display = 'block';
            document.getElementById('view-detail').style.display = 'none';
            window.scrollTo(0, 0);
        }

        function highlightChords(text) {
            const chordRegex = /\b([A-H][b#]?(m|maj|mi|dim|aug|sus)?[0-9]?(\/[A-H][b#]?)?)\b/g;

            return text.split('\n').map(line => {
                const hasLongWords = /[a-čďéěíňóřšťúůýžA-ČĎÉĚÍŇÓŘŠŤÚŮÝŽ]{4,}/.test(line);
                if (hasLongWords) {
                    return line;
                }
                return line.replace(chordRegex, '<span class="chord">$1</span>');
            }).join('\n');
        }

        window.addEventListener('popstate', () => {
            if (window.location.hash !== '#detail') {
                showListUI();
            }
        });

        // Automatické znovuzapnutí Wake Locku, pokud uživatel přepnul aplikaci a vrátil se
        document.addEventListener('visibilitychange', async () => {
            if (wakeLock !== null && document.visibilityState === 'visible') {
                await requestWakeLock();
            }
        });

        window.onload = () => {
            initTheme();
            fetchSongList();
        };
    </script>
</body>
</html>
