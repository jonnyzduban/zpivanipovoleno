<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🔥 Zpívání povoleno 2.0</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --card-hover: #2a2a2a;
            --text-color: #e0e0e0;
            --accent-color: #ff9800;
            --chord-color: #ffb74d;
            --border-color: #333;
        }

        body.light-theme {
            --bg-color: #ffffff;
            --card-bg: #ffffff;
            --card-hover: #f5f5f5;
            --text-color: #000000;
            --accent-color: #ff9800;
            --chord-color: #cc0000;
            --border-color: #eee;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 4px 6px;
            max-width: 800px;
            margin: 0 auto;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            transition: background-color 0.2s, color 0.2s;
        }

        .main-container {
            flex: 1;
        }

        /* Hlavička a Navigace */
        header {
            position: sticky;
            top: 0;
            background-color: var(--bg-color);
            padding: 4px 0;
            border-bottom: 2px solid var(--accent-color);
            margin-bottom: 6px;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: space-between;
            -webkit-user-select: none;
            user-select: none;
            touch-action: manipulation;
        }

        .header-title {
            font-size: 18px;
            font-weight: bold;
            color: var(--accent-color);
            cursor: pointer;
            display: flex;
            align-items: center;
            -webkit-user-select: none;
            user-select: none;
        }

        .header-controls {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .btn-ctrl {
            background-color: var(--card-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            touch-action: manipulation;
        }

        .btn-theme {
            background-color: var(--accent-color);
            color: #fff;
            border: none;
            padding: 4px 8px;
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
            touch-action: manipulation;
        }

        /* Vyhledávání a Seznam */
        .search-box {
            width: 100%;
            padding: 6px 10px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background-color: var(--card-bg);
            color: var(--text-color);
            font-size: 14px;
            margin-bottom: 6px;
            outline: none;
        }

        .song-list {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .song-item {
            background-color: var(--card-bg);
            padding: 5px 10px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            -webkit-user-select: none;
            user-select: none;
            touch-action: manipulation;
            line-height: 1.2;
        }

        .song-item:active {
            background-color: var(--card-hover);
        }

        .song-item::after {
            content: "❯";
            color: #888;
            font-size: 11px;
            margin-left: 6px;
        }

        .song-number {
            color: var(--accent-color);
            font-weight: normal;
            font-size: 0.85em;
            margin-right: 8px;
            opacity: 0.7;
            display: inline-block;
            width: 24px;
            text-align: right;
        }

        .artist-name {
            font-size: 0.85em;
            color: #888;
            font-weight: normal;
        }

        /* Varování vždy na jednom řádku, zmenšené písmo pro jistotu */
        .warning-banner {
            margin-top: 5px;
            margin-bottom: 5px;
            background-color: var(--card-bg);
            border: none;
            color: #aaa;
            padding: 4px 6px;
            border-radius: 5px;
            text-align: center;
            font-size: 9.5px;
            line-height: 1.2;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .warning-banner strong {
            color: #ff6666;
        }

        /* Detail Písně */
        .song-detail {
            display: none;
            background-color: var(--card-bg);
            padding: 10px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            overflow-x: auto;
        }

        .song-header-detail {
            display: flex;
            justify-content: space-between;
            align-items: center;
