<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🔥 Zpěvník k ohni</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --card-hover: #2a2a2a;
            --text-color: #e0e0e0;
            --accent-color: #ff9800;
            --chord-color: #ffb74d;
            --chord-bg: rgba(255, 183, 77, 0.2);
            --border-color: #333;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 12px;
            max-width: 800px;
            margin: 0 auto;
            min-height: 100vh;
        }

        /* Hlavička a Navigace */
        header {
            position: sticky;
            top: 0;
            background-color: var(--bg-color);
            padding: 12px 0 16px 0;
            border-bottom: 2px solid var(--accent-color);
            margin-bottom: 15px;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header-title {
            font-size: 26px;
            font-weight: bold;
            color: var(--accent-color);
            cursor: pointer;
            user-select: none;
            display: flex;
            align-items: center;
        }

        .btn-back {
            background-color: var(--accent-color);
            color: #000;
            font-weight: bold;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            cursor: pointer;
            display: none;
        }

        /* Vyhledávání a Seznam */
        .search-box {
            width: 100%;
            padding: 12px 16px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            background-color: var(--card-bg);
            color: var(--text-color);
            font-size: 16px;
            margin-bottom: 15px;
            outline: none;
        }

        .song-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .song-item {
            background-color: var(--card-bg);
            padding: 16px 20px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            font-size: 17px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .song-item:active {
            background-color: var(--card-hover);
        }

        .song-item::after {
            content: "❯";
            color: #666;
            font-size: 14px;
            margin-left: 10px;
        }

        /* Styl pro pořadové číslo */
        .song-number {
            color: var(--accent-color);
            font-weight: bold;
            margin-right: 8px;
            opacity: 0.8;
        }

        .artist-name {
            font-size: 0.85em;
            color: #aaa;
            font-weight: normal;
        }

        /* Detail Písně */
        .song-detail {
            display: none;
            background-color: var(--card-bg);
            padding: 16px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            overflow-x: auto;
        }

        .song-title {
            font-size: 22px;
            color: var(--accent-color);
            margin-bottom: 15px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border-color);
        }

        pre {
            font-family: 'Courier New', Courier, monospace;
            font-size: 13px;
            line-height: 1.5;
            white-space: pre;
            color: var(--text-color);
            margin: 0;
        }

        .chord {
            color: var(--chord-color);
            font-weight: bold;
            background-color: var(--chord-bg);
            padding: 1px 0;
            border-radius: 3px;
        }
    </style>
</head>
<body>

    <header>
        <div id="header-title" class="header-title" onclick="goBack()">🔥 Zpívání povoleno 2.0</div>
        <button class="btn-back" id="btn-back" onclick="goBack()">❮ Zpět</button>
    </header>

    <!-- POHLED 1: SEZNAM PÍSNÍ -->
    <div id="view-list">
        <input type="text" class="search-box" id="search" placeholder="🔍 Hledat písničku nebo interpreta..." oninput="filterSongs()">
        <div class="song-list" id="song-list">
            <div style="text-align: center; color: #888; padding: 20px;">Načítám seznam písní...</div>
        </div>
    </div>

    <!-- POHLED 2: DETAIL PÍSNĚ -->
    <div id="view-detail" class="song-detail">
        <h2 class="song-title" id="detail-title"></h2>
        <pre id="detail-content"></pre>
    </div>

    <script>
        let allSongs = [];
        let currentFilteredSongs = [];

        async function fetchSongList() {
            const listContainer = document.getElementById('song-list');
            
            try {
                const pathParts = window.location.pathname.split('/').filter(p => p);
                const hostnameParts = window.location.hostname.split('.');
                let songs = [];

                if (window.location.hostname.includes('github.io')) {
                    const user = hostnameParts[0];
                    const repo = pathParts[0] || '';
                    const apiUrl = `https://api.github.com/repos/${user}/${repo}/contents/`;

                    const response = await fetch(apiUrl);
                    if (response.ok) {
                        const files = await response.json();
                        songs = files
                            .filter(file => file.name.endsWith('.txt'))
                            .map(file => ({
                                formattedName: formatTitle(file.name),
                                rawName: cleanTitle(file.name),
                                url: file.download_url
                            }));
                    }
                }

                if (songs.length === 0) {
                    const res = await fetch('songs.json').catch(() => null);
                    if (res && res.ok) {
                        const fileNames = await res.json();
                        songs = fileNames.map(name => ({
                            formattedName: formatTitle(name),
                            rawName: cleanTitle(name),
                            url: name
                        }));
                    }
                }

                songs.sort((a, b) => a.rawName.localeCompare(b.rawName, 'cs', { sensitivity: 'base' }));

                allSongs = songs;
                renderSongList(allSongs);

            } catch (err) {
                listContainer.innerHTML = '<div style="text-align:center; padding:20px;">Chyba při načítání souborů.</div>';
            }
        }

        function cleanTitle(filename) {
            let name = filename.replace(/\.txt$/i, '').replace(/_/g, ' ').trim();
            if (name === name.toUpperCase()) {
                name = name.toLowerCase();
            }
            return name.charAt(0).toUpperCase() + name.slice(1);
        }

        function formatTitle(filename) {
            const fullTitle = cleanTitle(filename);
            const parts = fullTitle.split('-');

            if (parts.length > 1) {
                const songName = parts[0].trim();
                const artistName = parts.slice(1).join('-').trim();
                return `${songName} <span class="artist-name">- ${artistName}</span>`;
            }

            return fullTitle;
        }

        function renderSongList(songs) {
            currentFilteredSongs = songs;
            const listContainer = document.getElementById('song-list');
            
            if (songs.length === 0) {
                listContainer.innerHTML = '<div style="text-align:center; padding:20px;">Žádné písně nenalezeny. Nahrajte .txt soubory.</div>';
                return;
            }

            // Přidáno automatické číslo před každý název (index + 1)
            listContainer.innerHTML = songs.map((song, index) => `
                <div class="song-item" onclick="openSongByIndex(${index})">
                    <div>
                        <span class="song-number">${index + 1}.</span>${song.formattedName}
                    </div>
                </div>
            `).join('');
        }

        function filterSongs() {
            const query = document.getElementById('search').value.toLowerCase();
            const filtered = allSongs.filter(s => s.rawName.toLowerCase().includes(query));
            renderSongList(filtered);
        }

        function openSongByIndex(index) {
            const song = currentFilteredSongs[index];
            if (!song) return;

            history.pushState({ view: 'detail' }, '', '#detail');
            showDetailUI(song);
        }

        function showDetailUI(song) {
            document.getElementById('view-list').style.display = 'none';
            document.getElementById('view-detail').style.display = 'block';
            document.getElementById('btn-back').style.display = 'block';
            document.getElementById('detail-title').innerHTML = song.formattedName;

            openSongContent(song.url);
        }

        async function openSongContent(url) {
            const contentElem = document.getElementById('detail-content');
            contentElem.innerText = "Načítám...";

            try {
                const response = await fetch(decodeURIComponent(url));
                const text = await response.text();
                contentElem.innerHTML = highlightChords(text);
            } catch (err) {
                contentElem.innerText = "Chyba při načítání písně.";
            }

            window.scrollTo(0, 0);
        }

        function goBack() {
            if (window.location.hash === '#detail') {
                history.back();
            } else {
                showListUI();
            }
        }

        function showListUI() {
            document.getElementById('view-list').style.display = 'block';
            document.getElementById('view-detail').style.display = 'none';
            document.getElementById('btn-back').style.display = 'none';
            window.scrollTo(0, 0);
        }

        function highlightChords(text) {
            const chordRegex = /\b([A-H][b#]?(m|maj|mi|dim|aug|sus)?[0-9]?)\b/g;
            
            return text.split('\n').map(line => {
                const isChordLine = line.replace(chordRegex, '').trim() === '';
                if (isChordLine && line.trim() !== '') {
                    return line.replace(chordRegex, '<span class="chord">$1</span>');
                }
                return line;
            }).join('\n');
        }

        window.addEventListener('popstate', (event) => {
            if (window.location.hash !== '#detail') {
                showListUI();
            }
        });

        window.onload = fetchSongList;
    </script>
</body>
</html>
